# ISSUE-040 - promotion gate.
#
# Automatic deployment from main is disabled in render.yaml. This workflow is the
# repository-side gate that must be green before a commit is promoted by hand.
# It runs on GitHub Actions for every push and pull request against main.
#
# What this workflow can enforce: that the hermetic suite passes on the pinned
# production Python with the production safety configuration, from a clean
# checkout with no local `.env`.
#
# What it CANNOT enforce from inside the repository (external gate, see
# issue.md ISSUE-040): making this check *required* on main (branch protection),
# immutable artifact promotion, staged rollout and automated rollback criteria.
name: gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: Hermetic regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # A clean checkout has no `.env` (it is gitignored), so the test
      # environment is declared here instead of inherited from a developer
      # machine. Every value is a non-secret placeholder: the suite uses fakes
      # and never contacts a provider. The safety flags mirror render.yaml so
      # the gate exercises the configuration that actually ships.
      OPENAI_API_KEY: ci-placeholder-never-used
      STORAGE_BACKEND: sqlite
      ENABLE_INPUT_MODERATION: "true"
      ENABLE_SEMANTIC_SAFETY: "true"
      ENABLE_OUTPUT_SAFETY_CHECK: "true"
      # Nothing here should build the service at import time.
      SOULENE_SKIP_WARM: "1"
      # ISSUE-033: run the full (slow, subprocess-spawning) diagnostic-lane
      # hermeticity proofs in CI. They are skipped locally by default to keep the
      # everyday run fast.
      SOULENE_RUN_DIAGNOSTIC_LANES: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Must match PYTHON_VERSION in render.yaml: the gate is worthless if it
          # runs on a different interpreter than production.
          python-version: "3.12.7"
      - name: Pin the build toolchain
        run: pip install "pip==25.0"
      - name: Install pinned dependencies
        run: pip install -r requirements-dev.txt
      - name: Confirm no local environment file leaked into the checkout
        run: test ! -f .env
      - name: Regression suite
        run: python -m pytest -q tests --ignore=tests/test_mongo_integration.py
      - name: Deployment invariants
        # Redundant with the suite, but reported as its own step so a promotion
        # blocker is obvious in the run summary.
        run: python -m pytest -q tests/test_deployment.py
