<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Soulene AI</title>
  <style>
    :root {
      --bg: #eef2ff;
      --bg2: #f7f9fc;
      --panel: #ffffff;
      --user: #6366f1;
      --user-text: #ffffff;
      --bot: #f1f3f9;
      --bot-text: #1f2430;
      --muted: #7a8194;
      --border: #e3e7f0;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      background: linear-gradient(160deg, var(--bg) 0%, var(--bg2) 60%);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      color: var(--bot-text);
      padding: 16px;
    }
    .app {
      width: 100%;
      max-width: 760px;
      height: min(88vh, 820px);
      display: grid;
      grid-template-rows: auto 1fr auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(79, 70, 229, 0.12);
    }
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
    }
    .logo {
      width: 38px; height: 38px; border-radius: 12px;
      background: rgba(255,255,255,0.2);
      display: grid; place-items: center; font-size: 20px;
    }
    header h1 { font-size: 17px; margin: 0; font-weight: 600; }
    header small { display:block; font-weight: 400; opacity: 0.85; font-size: 12px; }
    .messages {
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }
    .row { display: flex; }
    .row.user { justify-content: flex-end; }
    .bubble {
      max-width: 78%;
      padding: 11px 15px;
      border-radius: 16px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
      font-size: 15px;
      animation: pop 0.18s ease-out;
    }
    @keyframes pop { from { transform: translateY(6px); opacity: 0; } to { transform: none; opacity: 1; } }
    .row.user .bubble { background: var(--user); color: var(--user-text); border-bottom-right-radius: 5px; }
    .row.bot .bubble { background: var(--bot); color: var(--bot-text); border-bottom-left-radius: 5px; }
    .tag {
      font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em;
      color: var(--muted); margin: 2px 6px 0; align-self: flex-start;
    }
    .typing { display: inline-flex; gap: 4px; }
    .typing span {
      width: 7px; height: 7px; border-radius: 50%; background: var(--muted);
      animation: blink 1.2s infinite both;
    }
    .typing span:nth-child(2){ animation-delay: .2s; }
    .typing span:nth-child(3){ animation-delay: .4s; }
    @keyframes blink { 0%,80%,100%{opacity:.2} 40%{opacity:1} }
    form {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      padding: 14px;
      border-top: 1px solid var(--border);
      background: #fff;
    }
    input {
      width: 100%; padding: 13px 15px;
      border: 1px solid var(--border); border-radius: 14px;
      font-size: 15px; outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(99,102,241,.15); }
    button {
      border: none; background: var(--accent); color: #fff;
      padding: 0 22px; border-radius: 14px; font-weight: 600; font-size: 15px;
      cursor: pointer; transition: background .15s;
    }
    button:hover { background: var(--accent-hover); }
    button:disabled { opacity: .6; cursor: not-allowed; }
    .error { color: #b91c1c; }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="logo">💜</div>
      <div>
        <h1>Soulene AI</h1>
        <small>Think Clear · Live Deep</small>
      </div>
    </header>

    <section id="messages" class="messages" aria-live="polite"></section>

    <form id="form" autocomplete="off">
      <input id="input" type="text" placeholder="Share what's on your mind..." required />
      <button id="send" type="submit">Send</button>
    </form>
  </main>

  <script>
    const messagesEl = document.getElementById('messages');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const send = document.getElementById('send');
    const sessionId = 'web-' + Math.random().toString(36).slice(2, 12);

    function addMessage(text, role) {
      const row = document.createElement('div');
      row.className = 'row ' + role;
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;
      row.appendChild(bubble);
      messagesEl.appendChild(row);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return bubble;
    }

    function addTyping() {
      const row = document.createElement('div');
      row.className = 'row bot';
      row.innerHTML = '<div class="bubble"><span class="typing"><span></span><span></span><span></span></span></div>';
      messagesEl.appendChild(row);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return row;
    }

    // Stream the reply token-by-token via SSE (POST + ReadableStream reader).
    async function streamMessage(message, bubble) {
      const res = await fetch('/chat/stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message, session_id: sessionId, user_id: sessionId })
      });
      if (!res.ok || !res.body) throw new Error('Request failed');

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      let text = '';
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const events = buffer.split('\n\n');
        buffer = events.pop();
        for (const evt of events) {
          const line = evt.replace(/^data:\s?/, '');
          if (line === '[DONE]') return text;
          try {
            const obj = JSON.parse(line);
            if (obj.delta) {
              text += obj.delta;
              bubble.textContent = text;
              messagesEl.scrollTop = messagesEl.scrollHeight;
            }
          } catch (_) { /* ignore partial frames */ }
        }
      }
      return text;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const message = input.value.trim();
      if (!message) return;
      addMessage(message, 'user');
      input.value = '';
      send.disabled = true;
      const typing = addTyping();
      let bubble = null;
      try {
        const text = await streamMessage(message, {
          get bubble() { return bubble; },
          set textContent(v) {
            if (!bubble) { typing.remove(); bubble = addMessage('', 'bot'); }
            bubble.textContent = v;
          }
        });
        if (!bubble) { typing.remove(); addMessage(text || 'No reply received.', 'bot'); }
      } catch (err) {
        typing.remove();
        const b = addMessage('Something went wrong. Please try again.', 'bot');
        b.classList.add('error');
      } finally {
        send.disabled = false;
        input.focus();
      }
    });

    addMessage("Hi, I'm Soulene AI. I'm here to listen and support you. How are you feeling today?", 'bot');
  </script>
</body>
</html>
